name: Build & Publish dashboard

on:
  push:
    branches: [main, claude/jolly-faraday-kz9a0]
  schedule:
    # Rebuild weekly (Mondays 06:00 UTC) so published figures stay current.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write   # needed to push the rendered site to the gh-pages branch

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: >-
            readr, dplyr, tidyr, stringr, lubridate, janitor, jsonlite

      - name: Build data (fetch live CKAN data + pre-aggregate)
        run: Rscript pipeline/build-data.R

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render & publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
