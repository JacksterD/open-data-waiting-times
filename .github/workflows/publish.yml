name: Build & Publish dashboard

on:
  push:
    branches: [main, claude/jolly-faraday-kz9a0]
  schedule:
    # Rebuild weekly (Mondays 06:00 UTC) so published figures stay current.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Permissions required for the official GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: >-
            readr, dplyr, tidyr, stringr, lubridate, janitor, jsonlite,
            phsmethods

      - name: Build data (fetch live CKAN data + pre-aggregate)
        run: Rscript pipeline/build-data.R

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
